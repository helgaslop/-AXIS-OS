[build]
  base    = "website"
  publish = "."
  functions = "../netlify/functions"
  command = ""

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.qrserver.com; connect-src 'self' https://*.netlify.app https://api.openai.com; font-src 'self' data:; frame-ancestors 'none';"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, x-admin-secret"

# Required environment variables (set in Netlify → Site settings → Env vars):
#   GMAIL_USER    = axis.os.assistant@gmail.com
#   GMAIL_PASS    = app-password-from-google
#   OWNER_EMAIL   = your-real@email.com   ← owner gets order notifications here
#   ADMIN_SECRET  = strong-password       ← protects /admin panel and license-admin API
