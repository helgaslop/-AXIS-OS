<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — AXIS OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#080c14;color:#e6edf3;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
.wrap{max-width:480px;}
.orb{font-size:80px;display:inline-block;animation:bob 3s ease-in-out infinite;margin-bottom:24px;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
h1{font-size:80px;font-weight:900;background:linear-gradient(135deg,#00d4ff,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
p{font-size:18px;color:#8b949e;margin:16px 0 36px;}
a{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:#00d4ff;color:#000;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;transition:all .25s;}
a:hover{background:#33ddff;transform:translateY(-2px);}
</style>
</head>
<body>
<div class="wrap">
  <div class="orb">⬡</div>
  <h1>404</h1>
  <p>Сторінку не знайдено.<br>Вона зникла або ніколи не існувала.</p>
  <a href="/">← На головну</a>
</div>
</body>
</html>
